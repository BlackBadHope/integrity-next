name: Feature request
description: Propose a bounded product improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Authority and privacy boundaries
      description: Identify external access, credentials, production effects or sensitive data.
    validations:
      required: true
