[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "integrity-bridges"
version = "0.7.0"
description = "Explicitly configured integrity-bridges sources for Integrity"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Integrity Project contributors" }]
dependencies = ["websockets>=13,<16"]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10"]

[project.scripts]
integrity-bridges = "integrity_bridges.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/integrity_bridges"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "NOTICE", "configuration.example.json", "CONFIGURATION-VALUES.json", "SOURCE-MAP.json", "legacy-tests", "tests", "pyproject.toml"]
