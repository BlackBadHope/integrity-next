[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "integrity-memory-plane"
version = "1.0.0"
description = "Explicitly configured integrity-memory-plane sources for Integrity"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Integrity Project contributors" }]
dependencies = ["integrity-guardian>=6.1.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10"]
postgres = ["psycopg[binary]>=3.2,<4"]
nats = ["nats-py>=2.15,<3"]
s3 = ["boto3>=1.35,<2"]

[project.scripts]
integrity-memory-plane = "integrity_memory_plane.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/integrity_memory_plane"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "NOTICE", "configuration.example.json", "CONFIGURATION-VALUES.json", "SOURCE-MAP.json", "legacy-tests", "tests", "pyproject.toml"]
