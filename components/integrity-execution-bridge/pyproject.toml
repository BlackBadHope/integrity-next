[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "integrity-execution-bridge"
version = "0.1.0rc5"
description = "Task-scoped MCP execution bridge for ChatGPT and Integrity"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
dependencies = ["jsonschema>=4.19.2,<5"]

[tool.setuptools.packages.find]
where = ["src"]
