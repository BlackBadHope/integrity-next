[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "integrity-llm-bus"
version = "1.0.0"
description = "Explicitly configured integrity-llm-bus sources for Integrity"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Integrity Project contributors" }]
dependencies = ["cryptography>=50.0.0,<51"]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10"]

[project.scripts]
integrity-llm-bus = "integrity_llm_bus.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/integrity_llm_bus"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "NOTICE", "configuration.example.json", "CONFIGURATION-VALUES.json", "SOURCE-MAP.json", "legacy-tests", "tests", "pyproject.toml"]
